[project]
name = "astrolabe"
version = "0.1.0"
description = "Celestial data collection & analysis — local catalog over public surveys."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=6.1",
    "astroquery>=0.4.7",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
]

[project.scripts]
astrolabe = "astrolabe.cli:main"

[project.optional-dependencies]
research = [
    "orbit-research @ git+https://github.com/constellation-works/orbit-research.git@0a9cf756e1c2522b9d5ee71c1cf462b8676f4281",
]
dev = [
    "orbit-research @ git+https://github.com/constellation-works/orbit-research.git@0a9cf756e1c2522b9d5ee71c1cf462b8676f4281",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astrolabe"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
